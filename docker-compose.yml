services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: amazon_api_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: sqlite:////app/data/supplier_intelligence.db
      FIREBASE_CREDENTIALS_PATH: /run/secrets/firebase-adminsdk.json
      CORS_ORIGINS: '["http://localhost", "http://localhost:80", "http://frontend", "http://localhost:8000"]'
    volumes:
      - db_data:/app/data
      - type: bind
        source: ${FIREBASE_CREDENTIALS_HOST_PATH:-./api-8a32a-firebase-adminsdk-fbsvc-1faa9d7722.json}
        target: /run/secrets/firebase-adminsdk.json
        read_only: true
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
    container_name: amazon_api_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  db_data:
    driver: local
