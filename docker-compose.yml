services:
  # ────────────────────────────────────────────────────────────────────────────
  # Backend – FastAPI / Uvicorn
  # ────────────────────────────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: amazon_api_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Override the DB path so it uses the mounted volume
      DATABASE_URL: sqlite:////app/data/supplier_intelligence.db
      # Allow the frontend container's nginx origin
      CORS_ORIGINS: '["http://localhost", "http://localhost:80", "http://frontend", "http://localhost:8000"]'
    volumes:
      # Persist the SQLite database outside the container
      - db_data:/app/data
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

  # ────────────────────────────────────────────────────────────────────────────
  # Frontend – React/Vite → built and served by Nginx
  # ────────────────────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Point the Vite build to the backend
        VITE_API_BASE_URL: http://localhost:8000
    container_name: amazon_api_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy

# ────────────────────────────────────────────────────────────────────────────
# Named volumes
# ────────────────────────────────────────────────────────────────────────────
volumes:
  db_data:
    driver: local
